<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作業指示書アプリ 入口</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f4f0; color: #111; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; line-height: 1.8; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { text-align: center; font-size: 24px; margin: 0 0 6px; }
  .sub { text-align: center; color: #6b6455; font-size: 14px; margin: 0 0 26px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 76px; border-radius: 16px; margin-bottom: 16px; text-decoration: none; font-size: 22px; font-weight: 800; color: #fff; letter-spacing: .04em; }
  .btn small { font-size: 13px; font-weight: 600; margin-left: 10px; opacity: .85; }
  .btn--aperta { background: #1a3a6b; border-bottom: 5px solid #b8963e; }
  .btn--byd { background: #1f1f1f; border-bottom: 5px solid #c8102e; }
  .guide { background: #fff; border: 2px solid #e5e0d2; border-radius: 16px; padding: 18px; margin-top: 22px; }
  .guide h2 { font-size: 17px; color: #1a3a6b; margin: 0 0 10px; }
  .guide p { margin: 0 0 10px; font-size: 15.5px; }
  .guide b { color: #1a3a6b; }
  .chip { display: inline-block; background: #eef2f8; border: 1.5px solid #1a3a6b; color: #1a3a6b; border-radius: 6px; padding: 0 8px; font-weight: 700; font-size: 14.5px; }
  .note { text-align: center; color: #9a938a; font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 作業指示書アプリ</h1>
  <p class="sub">自分のお店のボタンを押してください</p>

  <a class="btn btn--aperta" href="./aperta.html">アペルタ名古屋<small>を開く</small></a>
  <a class="btn btn--byd" href="./byd.html">BYD名古屋北<small>を開く</small></a>

  <div class="guide">
    <h2>⭐ ホーム画面にアイコンを作る（最初に1回だけ）</h2>
    <p><b>iPhone：</b>上のボタンでアプリを開く → 画面下の <span class="chip">共有 ⬆️</span> を押す → <span class="chip">ホーム画面に追加</span> → <span class="chip">追加</span></p>
    <p><b>Android：</b>上のボタンでアプリを開く → 右上の <span class="chip">⋮</span> を押す → <span class="chip">ホーム画面に追加</span></p>
    <p style="margin-bottom:0;">これでホーム画面のアイコンから、いつでも1タップで開けます。</p>
  </div>

  <p class="note">入力した内容は自分のスマホの中にだけ保存されます</p>
</div>
</body>
</html>
